name: Publicar release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-windows:
    name: Gerar e publicar distribuição Windows
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Obter o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validar identidade e definir versão
        id: validate-release
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          MSIX_SIGNING_PFX_BASE64: ${{ secrets.MSIX_SIGNING_PFX_BASE64 }}
          MSIX_SIGNING_PFX_PASSWORD: ${{ secrets.MSIX_SIGNING_PFX_PASSWORD }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(\.\d+)?)$') { throw "Use uma tag vMAJOR.MINOR.PATCH: $tag" }
          $version = $Matches[1]
          if ([string]::IsNullOrWhiteSpace($env:MSIX_PUBLISHER)) {
            throw 'Configure a variável de repositório MSIX_PUBLISHER com o Subject exato do certificado de distribuição.'
          }
          if ($env:MSIX_PUBLISHER -eq 'CN=Pulso 3.5 Dev') {
            throw 'O certificado de desenvolvimento não pode assinar uma release pública. Use um certificado de assinatura confiável.'
          }
          $artifactSigningValues = @(
            $env:ARTIFACT_SIGNING_ENDPOINT,
            $env:ARTIFACT_SIGNING_ACCOUNT,
            $env:ARTIFACT_SIGNING_PROFILE,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_TENANT_ID,
            $env:AZURE_SUBSCRIPTION_ID
          )
          $hasArtifactSigning = @($artifactSigningValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count -eq $artifactSigningValues.Count
          $hasPfxSigning = -not [string]::IsNullOrWhiteSpace($env:MSIX_SIGNING_PFX_BASE64) -and -not [string]::IsNullOrWhiteSpace($env:MSIX_SIGNING_PFX_PASSWORD)
          if (-not $hasArtifactSigning -and -not $hasPfxSigning) {
            throw 'Configure o Azure Artifact Signing (variáveis e secrets descritos no README) ou o certificado PFX nos secrets MSIX_SIGNING_PFX_BASE64 e MSIX_SIGNING_PFX_PASSWORD.'
          }
          $signingMode = if ($hasArtifactSigning) { 'artifact-signing' } else { 'pfx' }
          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'versao.txt'), $version + "`n", (New-Object System.Text.UTF8Encoding($false)))
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNING_MODE=$signingMode" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signing-mode=$signingMode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Instalar Microsoft MSIX Packaging Tool
        shell: pwsh
        run: |
          winget install --id 9N5LW3JBCXKF --source msstore --exact --silent --accept-source-agreements --accept-package-agreements
          Start-Sleep -Seconds 3
          if (-not (Get-Command 'MsixPackagingTool.exe' -ErrorAction SilentlyContinue)) {
            $package = Get-AppxPackage -Name Microsoft.MsixPackagingTool
            if (-not $package) { throw 'O MSIX Packaging Tool não ficou disponível após a instalação.' }
            $env:PATH = $package.InstallLocation + ';' + $env:PATH
            "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Compilar aplicativo
        shell: pwsh
        run: .\Compilar.ps1

      - name: Entrar no Azure com identidade federada do GitHub
        if: steps.validate-release.outputs.signing-mode == 'artifact-signing'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Assinar executável portátil com Azure Artifact Signing
        if: steps.validate-release.outputs.signing-mode == 'artifact-signing'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\app\Pulso35.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Pulso 3.5
          description-url: https://github.com/vini-cius/pulso3.5
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Importar certificado PFX e assinar executável portátil
        if: steps.validate-release.outputs.signing-mode == 'pfx'
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_SIGNING_PFX_BASE64: ${{ secrets.MSIX_SIGNING_PFX_BASE64 }}
          MSIX_SIGNING_PFX_PASSWORD: ${{ secrets.MSIX_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:MSIX_SIGNING_PFX_PASSWORD)) {
            throw 'Configure os secrets MSIX_SIGNING_PFX_BASE64 e MSIX_SIGNING_PFX_PASSWORD para assinar a release.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'pulso35-signing.pfx'
          try {
            [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MSIX_SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:MSIX_SIGNING_PFX_PASSWORD -AsPlainText -Force
            $certificates = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password
            $certificate = $certificates | Where-Object Subject -eq $env:MSIX_PUBLISHER | Select-Object -First 1
            if (-not $certificate -or -not $certificate.HasPrivateKey) { throw 'O PFX não tem uma chave privada válida com o Subject configurado em MSIX_PUBLISHER.' }
            if ($certificate.NotAfter -le (Get-Date)) { throw 'O certificado de assinatura está expirado.' }
            $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $signTool = Get-ChildItem $sdkBin -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.DirectoryName -match '\\x64$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw 'SignTool.exe não foi encontrado no Windows 10/11 SDK.' }
            $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\app\Pulso35.exe'
            & $signTool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /s My /tr 'http://timestamp.acs.microsoft.com' /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw "A assinatura Authenticode do executável falhou (código $LASTEXITCODE)." }
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Criar MSIX e arquivo do App Installer
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          SIGNING_MODE: ${{ steps.validate-release.outputs.signing-mode }}
        run: |
          $arguments = @('-SkipBuild', '-PublisherName', $env:MSIX_PUBLISHER, '-ReleaseTag', $env:GITHUB_REF_NAME)
          if ($env:SIGNING_MODE -eq 'artifact-signing') { $arguments += '-SkipSigning' }
          & .\Preparar-Instalador.ps1 @arguments

      - name: Assinar MSIX com Azure Artifact Signing
        if: steps.validate-release.outputs.signing-mode == 'artifact-signing'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\Pulso35-MSIX-${{ steps.validate-release.outputs.version }}.msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Instalador do Pulso 3.5
          description-url: https://github.com/vini-cius/pulso3.5
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verificar as assinaturas dos arquivos distribuídos
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signTool = Get-ChildItem $sdkBin -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match '\\x64$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'SignTool.exe não foi encontrado para validar as assinaturas.' }
          $files = @(
            (Join-Path $env:GITHUB_WORKSPACE 'dist\app\Pulso35.exe'),
            (Join-Path $env:GITHUB_WORKSPACE "dist\Pulso35-MSIX-$env:RELEASE_VERSION.msix")
          )
          foreach ($file in $files) {
            & $signTool.FullName verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "A assinatura não passou na verificação: $file (código $LASTEXITCODE)." }
          }

      - name: Preparar pacote portátil e manifesto do atualizador
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $env:RELEASE_VERSION
          $zipName = "Pulso35-Portable-$version.zip"
          $packageUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$zipName"
          .\Preparar-Atualizacao.ps1 -SkipBuild -PackageUrl $packageUrl -Notas "Versão $version do Pulso 3.5."
          $assets = @(
            (Join-Path 'dist' "Pulso35-MSIX-$version.msix"),
            (Join-Path 'dist' 'Pulso35.appinstaller'),
            (Join-Path 'dist\atualizacao' $zipName),
            (Join-Path 'dist\atualizacao' 'latest.json')
          )
          $lines = foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Artefato ausente: $asset" }
            $hash = (Get-FileHash -Path $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($asset))"
          }
          [System.IO.File]::WriteAllLines((Join-Path 'dist' 'SHA256SUMS.txt'), $lines, (New-Object System.Text.UTF8Encoding($false)))

      - name: Publicar release no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_VERSION
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag `
            "dist\Pulso35-MSIX-$version.msix" `
            'dist\Pulso35.appinstaller' `
            "dist\atualizacao\Pulso35-Portable-$version.zip" `
            'dist\atualizacao\latest.json' `
            'dist\SHA256SUMS.txt' `
            --verify-tag --title "Pulso 3.5 $version" --generate-notes
